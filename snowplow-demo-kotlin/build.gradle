plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.snowplowanalytics.snowplowdemokotlin'

    defaultConfig {
        applicationId 'com.snowplowanalytics.snowplowdemokotlin'
        minSdkVersion 24
        targetSdkVersion 34
        compileSdk 34
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        signingConfig signingConfigs.debug
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.snowplowanalytics:snowplow-android-tracker:6.0.5'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.browser:browser:1.5.0'
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation "com.android.installreferrer:installreferrer:2.2"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-runtime-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'androidx.fragment:fragment:1.5.7'
    implementation 'com.google.android.material:material:1.12.0'
    // Koin Core for Kotlin
    implementation "io.insert-koin:koin-core:3.5.6"
    // Koin Android
    implementation "io.insert-koin:koin-android:3.5.6"
    // Koin Coroutine
    implementation "io.insert-koin:koin-core-coroutines:3.5.6"
    // App Startup
    implementation "androidx.startup:startup-runtime:1.1.1"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.0.0"
}
