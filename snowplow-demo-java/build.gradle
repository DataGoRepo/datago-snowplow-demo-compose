apply plugin: 'com.android.application'

project.ext {
    archLifecycleVersion = "2.2.0"
}

android {
    namespace="com.snowplowanalytics.snowplowtrackerdemojava"

    defaultConfig {
        applicationId "com.snowplowanalytics.snowplowtrackerdemojava"
        minSdkVersion 21
        targetSdkVersion 34
        compileSdk 34
        buildToolsVersion='34.0.0'
        versionCode 3
        versionName "0.3.0"
        signingConfig signingConfigs.debug
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            testCoverageEnabled = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.outputFileName = "snowplow-demo-app-${output.baseName}.apk"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation "androidx.lifecycle:lifecycle-extensions:$project.archLifecycleVersion"
    implementation 'com.snowplowanalytics:snowplow-android-tracker:6.0.5'
    implementation 'androidx.browser:browser:1.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.google.code.gson:gson:2.9.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.9'
}
